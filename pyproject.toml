[project]
name = "gridworks-ltn"
version = "0.0.1"
description = "GridWorks LTN — the Leaf Transactive Node as a gwbase actor: hears its scada, bids into the market."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "GridWorks", email = "gridworks@gridworks-consulting.com" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.9",
    "gridworks-base>=0.7.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[project.scripts]
gwltn = "gwltn.cli:main"

[project.urls]
Homepage = "https://github.com/thegridelectric/gridworks-ltn"
Repository = "https://github.com/thegridelectric/gridworks-ltn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwltn"]

[dependency-groups]
dev = [
    "paho-mqtt>=2.1",
    "pyright>=1.1.408",
    "pytest>=8.0",
    "ruff>=0.5.6",
]

[tool.pytest.ini_options]
markers = [
    "broker: needs the gwbase dev broker on localhost:5672 and its MQTT door on 1885",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/gwltn/sema"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    # Generated by scripts/regen_sema_snapshot.sh: checking it means editing
    # it, and edits vanish at regen.
    "src/gwltn/sema",
]
output-format = "concise"
fix = true
show-fixes = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
preview = true
